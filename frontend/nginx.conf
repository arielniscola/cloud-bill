server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    # Sin esto nginx NO comprime lo que viene del backend por proxy, y el
    # snapshot de catalogo viaja sin comprimir (son ~10x mas bytes).
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/manifest+json;

    # ── PWA: archivos que NUNCA se cachean ────────────────────────────
    # Si el navegador se queda con un sw.js viejo, la app no vuelve a
    # actualizarse nunca. Este bloque va ANTES del de assets estaticos
    # porque nginx evalua los regex en orden y el primero que matchea gana.
    location ~* ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # El manifest y el shell se revalidan en cada carga.
    location = /manifest.webmanifest {
        expires off;
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache";
    }

    # SPA routing — todas las rutas van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy a la API del backend
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Cache para assets estaticos (llevan hash en el nombre)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
